spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
    function:
      definition: ""
    stream:
      kafka:
        binder:
          brokers: localhost:9092
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/test
          jwk-set-uri: http://localhost:8085/realms/test/protocol/openid-connect/certs

eureka:
  client:
    enabled: false

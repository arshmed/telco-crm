spring:
  datasource:
    url: jdbc:postgresql://localhost:5407/billing
    username: postgres
    password: test12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/telcocrm-gygy5
          jwk-set-uri: http://localhost:8085/realms/telcocrm-gygy5/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: billing-service
            client-secret: billing-service-secret
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8085/realms/telcocrm-gygy5/protocol/openid-connect/token

  cloud:
    function:
      definition: subscriptionActivatedEvent;usageAggregatedEvent;paymentCompletedEvent
    stream:
      bindings:
        subscriptionActivatedEvent-in-0:
          destination: subscription-activated-topic
          group: billing-service
          content-type: application/json
        usageAggregatedEvent-in-0:
          destination: usage-aggregated-topic
          group: billing-service
          content-type: application/json
        paymentCompletedEvent-in-0:
          destination: payment-completed-topic
          group: billing-service
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

resilience4j:
  circuitbreaker:
    instances:
      productCatalogServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

server:
  port: 9007

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

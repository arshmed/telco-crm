server:
  port: 9002

spring:
  datasource:
    url: jdbc:postgresql://localhost:5402/customer
    username: postgres
    password: test12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "customer:"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/telcocrm-gygy5
          jwk-set-uri: http://localhost:8085/realms/telcocrm-gygy5/protocol/openid-connect/certs

  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092

app:
  encryption:
    key: ${ENCRYPTION_KEY:fN0a/GgrmSqDo3KzFVY8WP1GRaD4QGsKiTi7XOZq5t8=}

logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: logs/customer-service.log

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost

springdoc:
  api-docs:
    path: /api/v1/customers/api-docs
  swagger-ui:
    path: /api/v1/customers/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans


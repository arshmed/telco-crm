server:
  port: 9009

spring:
  datasource:
    url: jdbc:postgresql://localhost:5409/notification
    username: postgres
    password: test12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: noreply.telcocrm@gmail.com
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 30m
      key-prefix: "notification:"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/telcocrm-gygy5
          jwk-set-uri: http://localhost:8085/realms/telcocrm-gygy5/protocol/openid-connect/certs

  cloud:
    function:
      definition: customerRegisteredEvent;customerKycApprovedEvent;customerKycRejectedEvent;customerUpdatedEvent;orderCreatedEvent;orderConfirmedEvent;orderCancelledEvent;quotaThresholdReachedEvent;quotaExceededEvent
    stream:
      bindings:
        customerRegisteredEvent-in-0:
          destination: customer-registered-topic
          content-type: application/json
        customerKycApprovedEvent-in-0:
          destination: customer-kyc-approved-topic
          content-type: application/json
        customerKycRejectedEvent-in-0:
          destination: customer-kyc-rejected-topic
          content-type: application/json
        customerUpdatedEvent-in-0:
          destination: customer-updated-topic
          content-type: application/json
        orderCreatedEvent-in-0:
          destination: order-created-topic
          content-type: application/json
        orderConfirmedEvent-in-0:
          destination: order-confirmed-topic
          content-type: application/json
        orderCancelledEvent-in-0:
          destination: order-cancelled-topic
          content-type: application/json
        quotaThresholdReachedEvent-in-0:
          destination: quota-threshold-reached-topic
          content-type: application/json
        quotaExceededEvent-in-0:
          destination: quota-exceeded-topic
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: logs/notification-service.log

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost

springdoc:
  api-docs:
    path: /api/v1/notifications/api-docs
  swagger-ui:
    path: /api/v1/notifications/swagger-ui.html

notification:
  email:
    from: noreply.telcocrm@gmail.com

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

spring:
  datasource:
    url: jdbc:postgresql://localhost:5405/subscription
    username: postgres
    password: test12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/telcocrm-gygy5
          jwk-set-uri: http://localhost:8085/realms/telcocrm-gygy5/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: subscription-service
            client-secret: subscription-service-secret
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8085/realms/telcocrm-gygy5/protocol/openid-connect/token
  cloud:
    function:
      definition: orderCreatedEvent;orderCancelledEvent;paymentCompletedEvent
    stream:
      bindings:
        orderCreatedEvent-in-0:
          destination: order-created-topic
          group: subscription-service
          content-type: application/json
        orderCancelledEvent-in-0:
          destination: order-cancelled-topic
          group: subscription-service
          content-type: application/json
        paymentCompletedEvent-in-0:
          destination: payment-completed-topic
          group: subscription-service
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092

server:
  port: 9005

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: logs/subscription-service.log

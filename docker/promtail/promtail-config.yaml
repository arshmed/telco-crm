server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/telco-crm/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: '"@timestamp"'
      - timestamp:
          source: ts
          format: RFC3339Nano
      - regex:
          source: filename
          expression: '/var/log/telco-crm/logs/(?P<service_name>[^-]+(?:-[^-]+)*)\.log'
      - labels:
          service_name:

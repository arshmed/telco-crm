<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <text x="60" y="40" font-size="16" font-weight="bold" fill="#0f172a">1) Servis Haritası</text>

  <rect x="490" y="55" width="220" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="14" fill="#4c1d95">Keycloak — Kimlik &amp; Erişim</text>

  <line x1="600" y1="115" x2="600" y2="150" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="150" y1="150" x2="1050" y2="150" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="150" y1="150" x2="150" y2="160" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>
  <line x1="375" y1="150" x2="375" y2="160" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>
  <line x1="600" y1="150" x2="600" y2="160" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>
  <line x1="825" y1="150" x2="825" y2="160" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>
  <line x1="1050" y1="150" x2="1050" y2="160" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>

  <rect x="60" y="160" width="180" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="200" text-anchor="middle" font-size="14" fill="#1e3a8a">Product Catalog</text>

  <rect x="285" y="160" width="180" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="375" y="200" text-anchor="middle" font-size="14" fill="#1e3a8a">Order</text>

  <rect x="510" y="160" width="180" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="200" text-anchor="middle" font-size="14" fill="#1e3a8a">Subscription</text>

  <rect x="735" y="160" width="180" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="825" y="200" text-anchor="middle" font-size="14" fill="#1e3a8a">Usage Service</text>

  <rect x="960" y="160" width="180" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1050" y="200" text-anchor="middle" font-size="14" fill="#1e3a8a">Payment</text>

  <line x1="240" y1="195" x2="285" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="195" x2="510" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="195" x2="735" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="195" x2="960" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="262" y="248" text-anchor="middle" font-size="11" fill="#334155">ürün/tarife verisi</text>
  <text x="487" y="248" text-anchor="middle" font-size="11" fill="#334155">sipariş onayı</text>
  <text x="712" y="248" text-anchor="middle" font-size="11" fill="#334155">aktif abonelik</text>
  <text x="937" y="248" text-anchor="middle" font-size="11" fill="#334155">kullanım verisi</text>

  <text x="60" y="305" font-size="16" font-weight="bold" fill="#0f172a">2) Uçtan Uca Müşteri Akışı</text>

  <rect x="60" y="340" width="180" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="75" cy="340" r="18" fill="#0ea5e9"/>
  <text x="75" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <text x="150" y="375" text-anchor="middle" font-size="13" fill="#0f172a">Tarife/Paket Seçimi</text>
  <text x="150" y="395" text-anchor="middle" font-size="11" fill="#64748b">(Product Catalog)</text>

  <rect x="285" y="340" width="180" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="300" cy="340" r="18" fill="#0ea5e9"/>
  <text x="300" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="375" y="375" text-anchor="middle" font-size="13" fill="#0f172a">Sipariş Oluşturma</text>
  <text x="375" y="395" text-anchor="middle" font-size="11" fill="#64748b">(Order)</text>

  <rect x="510" y="340" width="180" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="525" cy="340" r="18" fill="#0ea5e9"/>
  <text x="525" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="600" y="375" text-anchor="middle" font-size="13" fill="#0f172a">Abonelik Aktivasyonu</text>
  <text x="600" y="395" text-anchor="middle" font-size="11" fill="#64748b">(Subscription)</text>

  <rect x="735" y="340" width="180" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="750" cy="340" r="18" fill="#0ea5e9"/>
  <text x="750" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="825" y="375" text-anchor="middle" font-size="13" fill="#0f172a">Kullanım Takibi</text>
  <text x="825" y="395" text-anchor="middle" font-size="11" fill="#64748b">(Usage Service)</text>

  <rect x="960" y="340" width="180" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <circle cx="975" cy="340" r="18" fill="#0ea5e9"/>
  <text x="975" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">5</text>
  <text x="1050" y="375" text-anchor="middle" font-size="13" fill="#0f172a">Faturalama / Ödeme</text>
  <text x="1050" y="395" text-anchor="middle" font-size="11" fill="#64748b">(Payment)</text>

  <line x1="240" y1="380" x2="285" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="380" x2="510" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="380" x2="735" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="380" x2="960" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="60" y="465" font-size="16" font-weight="bold" fill="#0f172a">3) Durum Şablonu (rengi elle güncelle)</text>

  <rect x="60" y="485" width="160" height="50" rx="8" fill="#22c55e" fill-opacity="0.25" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="515" text-anchor="middle" font-size="13" fill="#166534">Tamamlandı</text>

  <rect x="280" y="485" width="160" height="50" rx="8" fill="#f59e0b" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="515" text-anchor="middle" font-size="13" fill="#92400e">Devam Ediyor</text>

  <rect x="500" y="485" width="160" height="50" rx="8" fill="#9ca3af" fill-opacity="0.25" stroke="#6b7280" stroke-width="2"/>
  <text x="580" y="515" text-anchor="middle" font-size="13" fill="#374151">Planlanan</text>

  <text x="60" y="575" font-size="12" fill="#475569">Not: Servis/adım kutularının dolgu rengini gerçek duruma göre Figma'da güncelle.</text>
  <text x="60" y="595" font-size="12" fill="#475569">Örnek: Product Catalog için tarife/ek paket yayınlama tamamlandı; retire endpoint,</text>
  <text x="60" y="615" font-size="12" fill="#475569">effectiveTo filtresi ve 403 handler henüz devam ediyor. Diğer servislerin durumunu</text>
  <text x="60" y="635" font-size="12" fill="#475569">ilgili arkadaşlarınla teyit et.</text>
</svg>

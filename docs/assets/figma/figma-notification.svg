<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <rect x="760" y="28" width="200" height="30" rx="15" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="860" y="48" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Kaynak: README</text>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">Notification Service — Detaylı Akış</text>
  <text x="40" y="64" font-size="13" fill="#57697a">Event'leri template'e eşleyip EMAIL/SMS ile dağıtan merkezi servis · 9009</text>

  <text x="40" y="102" font-size="13" font-weight="bold" fill="#334155">GİRDİ / BAĞIMLILIK (fan-in)</text>
  <text x="760" y="102" font-size="13" font-weight="bold" fill="#334155">ÇIKTI / TÜKETİCİ</text>

  <!-- Left: 4 boxes -->
  <rect x="40" y="145" width="200" height="55" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="177" text-anchor="middle" font-size="12.5" fill="#075985">Customer Service</text>
  <line x1="240" y1="172" x2="320" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="164" text-anchor="middle" font-size="8" fill="#475569">Registered/Updated/KYC*</text>

  <rect x="40" y="225" width="200" height="55" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="140" y="257" text-anchor="middle" font-size="12.5" fill="#164e63">Order Service</text>
  <line x1="240" y1="252" x2="320" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="244" text-anchor="middle" font-size="8" fill="#475569">Created/Confirmed/Cancelled</text>

  <rect x="40" y="305" width="200" height="55" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="337" text-anchor="middle" font-size="12.5" fill="#92400e">Usage Service</text>
  <line x1="240" y1="332" x2="320" y2="332" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="324" text-anchor="middle" font-size="8" fill="#475569">QuotaThreshold/Exceeded</text>

  <rect x="40" y="385" width="200" height="55" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="417" text-anchor="middle" font-size="12.5" fill="#991b1b">Ticket Service</text>
  <line x1="240" y1="412" x2="320" y2="412" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="404" text-anchor="middle" font-size="8" fill="#475569">TicketOpened/Resolved</text>

  <!-- Center -->
  <rect x="320" y="100" width="360" height="380" rx="14" fill="#fae8ff" stroke="#c026d3" stroke-width="2.5"/>
  <text x="500" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#86198f">Notification</text>
  <line x1="350" y1="185" x2="650" y2="185" stroke="#c026d3" stroke-width="1" opacity="0.4"/>
  <text x="350" y="210" font-size="13" font-weight="bold" fill="#86198f">İç Akış</text>
  <text x="350" y="236" font-size="12" fill="#1e293b">1. Gelen event'i templateCode'a eşle</text>
  <text x="350" y="260" font-size="12" fill="#1e293b">2. Kanal seç (EMAIL / SMS)</text>
  <text x="350" y="284" font-size="12" fill="#1e293b">3. SMTP (smtp.gmail.com:587) ile gönder</text>
  <text x="350" y="308" font-size="12" fill="#1e293b">4. NotificationDispatchedEvent + Redis cache</text>

  <rect x="400" y="345" width="200" height="34" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500" y="367" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">JWT · Keycloak</text>

  <!-- Right: 1 box, external -->
  <rect x="760" y="255" width="200" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="860" y="285" text-anchor="middle" font-size="13" fill="#334155">Müşteri</text>
  <text x="860" y="303" text-anchor="middle" font-size="10.5" fill="#64748b">(Email / SMS)</text>

  <line x1="680" y1="290" x2="760" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="278" text-anchor="middle" font-size="8.5" fill="#475569">Dispatched</text>

  <text x="40" y="520" font-size="12" font-style="italic" fill="#a21caf">Not: POST /api/v1/notifications ile manuel tetikleme de var</text>
  <text x="40" y="542" font-size="12" font-style="italic" fill="#a21caf">(event dışı, elle bildirim gönderimi).</text>
</svg>

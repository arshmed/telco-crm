<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <rect x="760" y="28" width="200" height="30" rx="15" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="860" y="48" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Kaynak: README</text>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">Order Service — Detaylı Akış</text>
  <text x="40" y="64" font-size="13" fill="#57697a">Sipariş yaşam döngüsü + ödeme/abonelik saga orkestrasyonu · 9004</text>

  <text x="40" y="102" font-size="13" font-weight="bold" fill="#334155">GİRDİ / BAĞIMLILIK</text>
  <text x="760" y="102" font-size="13" font-weight="bold" fill="#334155">ÇIKTI / TÜKETİCİ</text>

  <!-- Left: 3 boxes -->
  <rect x="40" y="170" width="200" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="205" text-anchor="middle" font-size="13" fill="#075985">Customer Service</text>
  <line x1="240" y1="200" x2="320" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="192" text-anchor="middle" font-size="8.5" fill="#475569">Feign: müşteri doğrula</text>

  <rect x="40" y="260" width="200" height="60" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="295" text-anchor="middle" font-size="13" fill="#1e3a8a">Product Catalog</text>
  <line x1="240" y1="290" x2="320" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="282" text-anchor="middle" font-size="8.5" fill="#475569">Feign: tarife/addon doğrula</text>

  <rect x="40" y="350" width="200" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="140" y="378" text-anchor="middle" font-size="12.5" fill="#334155">Payment,</text>
  <text x="140" y="396" text-anchor="middle" font-size="12.5" fill="#334155">Subscription</text>
  <line x1="240" y1="380" x2="320" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="372" text-anchor="middle" font-size="8.5" fill="#475569">Payment*/Subscription* event</text>

  <!-- Center -->
  <rect x="320" y="100" width="360" height="380" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/>
  <text x="500" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#164e63">Order</text>
  <line x1="350" y1="185" x2="650" y2="185" stroke="#0891b2" stroke-width="1" opacity="0.4"/>
  <text x="350" y="210" font-size="13" font-weight="bold" fill="#164e63">İç Akış</text>
  <text x="350" y="236" font-size="12" fill="#1e293b">1. Customer + Catalog Feign ile doğrula</text>
  <text x="350" y="260" font-size="12" fill="#1e293b">2. Sipariş oluştur, saga başlat (currentStep)</text>
  <text x="350" y="284" font-size="12" fill="#1e293b">3. Payment/Subscription event'i saga'yı ilerletir</text>
  <text x="350" y="308" font-size="12" fill="#1e293b">4. OrderConfirmed / OrderCancelled ile bitir</text>

  <rect x="400" y="345" width="200" height="34" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500" y="367" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">JWT · Keycloak</text>

  <!-- Right: 2 boxes -->
  <rect x="760" y="200" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="860" y="233" text-anchor="middle" font-size="13" fill="#334155">Payment,</text>
  <text x="860" y="251" text-anchor="middle" font-size="13" fill="#334155">Subscription</text>
  <line x1="680" y1="235" x2="760" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="223" text-anchor="middle" font-size="8.5" fill="#475569">OrderCreated/Cancelled</text>

  <rect x="760" y="310" width="200" height="70" rx="10" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
  <text x="860" y="350" text-anchor="middle" font-size="13" fill="#86198f">Notification</text>
  <line x1="680" y1="345" x2="760" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="333" text-anchor="middle" font-size="8.5" fill="#475569">OrderConfirmed vb.</text>

  <text x="40" y="520" font-size="12" font-style="italic" fill="#0e7490">Not: docs/README.md güncel değil ("subscription-service henüz</text>
  <text x="40" y="542" font-size="12" font-style="italic" fill="#0e7490">yazılmadı" diyor) — kök README'yi esas al.</text>
</svg>

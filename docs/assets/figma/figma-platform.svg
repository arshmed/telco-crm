<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowStone" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#78716c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <rect x="760" y="28" width="200" height="30" rx="15" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="860" y="48" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">5 Altyapı Bileşeni</text>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0f172a">Platform Katmanı — Detaylı Akış</text>
  <text x="40" y="64" font-size="13" fill="#57697a">Giriş noktası, kimlik doğrulama, servis keşfi ve merkezi konfigürasyon</text>

  <!-- FE -->
  <rect x="390" y="90" width="220" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">telco-crm-fe</text>
  <text x="500" y="133" text-anchor="middle" font-size="10.5" fill="#64748b">React · Vite · 5173 · credentials:include</text>

  <line x1="500" y1="150" x2="500" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BFF -->
  <rect x="350" y="190" width="300" height="90" rx="12" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
  <text x="500" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">BFF Server — 9011</text>
  <text x="500" y="244" text-anchor="middle" font-size="11" fill="#1e293b">OAuth2 login (bff-client) · session/cookie</text>
  <text x="500" y="262" text-anchor="middle" font-size="11" fill="#1e293b">CSRF (XOR) · TokenRelay → gateway</text>

  <line x1="500" y1="280" x2="500" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="350" y="320" width="300" height="90" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="500" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#312e81">API Gateway — 8080</text>
  <text x="500" y="374" text-anchor="middle" font-size="11" fill="#312e81">gateway-server · JWT resource server</text>
  <text x="500" y="392" text-anchor="middle" font-size="11" fill="#312e81">rate limit (Redis, 100 req/s) · routing</text>

  <line x1="500" y1="410" x2="500" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Domain group -->
  <rect x="310" y="450" width="380" height="80" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="500" y="483" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">10 Domain Servisi</text>
  <text x="500" y="503" text-anchor="middle" font-size="10.5" fill="#475569">Customer, Catalog, Order, Subscription, Usage,</text>
  <text x="500" y="519" text-anchor="middle" font-size="10.5" fill="#475569">Billing, Payment, Notification, Ticket, Identity</text>

  <!-- Keycloak -->
  <rect x="740" y="225" width="220" height="90" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="850" y="257" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">Keycloak — 8085</text>
  <text x="850" y="279" text-anchor="middle" font-size="10.5" fill="#4c1d95">realm: telcocrm-gygy5</text>
  <text x="850" y="297" text-anchor="middle" font-size="10.5" fill="#4c1d95">login · JWT issuance/refresh</text>

  <line x1="740" y1="255" x2="650" y2="235" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowViolet)"/>
  <line x1="740" y1="280" x2="650" y2="365" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowViolet)"/>

  <rect x="740" y="330" width="220" height="55" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="850" y="350" text-anchor="middle" font-size="10.5" fill="#7c2d12">keyclock/realm-export.json</text>
  <text x="850" y="368" text-anchor="middle" font-size="10.5" fill="#7c2d12">→ container start'ta --import-realm</text>

  <!-- Discovery -->
  <rect x="60" y="590" width="230" height="80" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="175" y="622" text-anchor="middle" font-size="14" font-weight="bold" fill="#134e4a">Discovery Server — 8761</text>
  <text x="175" y="644" text-anchor="middle" font-size="10.5" fill="#134e4a">Eureka registry (standalone)</text>
  <text x="175" y="662" text-anchor="middle" font-size="10.5" fill="#134e4a">her servis lb://&lt;servis-adı&gt; ile bulunur</text>

  <line x1="175" y1="590" x2="175" y2="130" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowTeal)"/>

  <!-- Config -->
  <rect x="680" y="590" width="230" height="80" rx="12" fill="#f5f5f4" stroke="#78716c" stroke-width="2"/>
  <text x="795" y="622" text-anchor="middle" font-size="14" font-weight="bold" fill="#44403c">Config Server — 8888</text>
  <text x="795" y="644" text-anchor="middle" font-size="10.5" fill="#44403c">configs/ klasörü (native profil)</text>
  <text x="795" y="662" text-anchor="middle" font-size="10.5" fill="#44403c">her servis application.yml'ı buradan çeker</text>

  <line x1="795" y1="590" x2="795" y2="130" stroke="#78716c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowStone)"/>

  <text x="40" y="710" font-size="12" font-style="italic" fill="#475569">Not: api-gateway CORS tanımlamaz (sadece bff-server'da) — çift CORS header tarayıcıda hataya neden olur.</text>
  <text x="40" y="732" font-size="12" font-style="italic" fill="#475569">Not: config-server Git değil, yerel configs/ klasöründen native profille okur.</text>
</svg>

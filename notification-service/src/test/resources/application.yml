spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/test
          jwk-set-uri: http://localhost:8085/realms/test/protocol/openid-connect/certs
  cloud:
    function:
      definition: none
    stream:
      kafka:
        binder:
          brokers: localhost:9092

spring:
  config:
    import: "optional:configserver:"
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/test
          jwk-set-uri: http://localhost:8085/realms/test/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: usage-service
            client-secret: test-secret
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:8085/realms/test/protocol/openid-connect/token

eureka:
  client:
    enabled: false
